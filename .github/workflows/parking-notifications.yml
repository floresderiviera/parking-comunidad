name: Parking notifications scheduler (isolated)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PARKING_NOTIFICATION_URL: ${{ secrets.PARKING_NOTIFICATION_URL }}
      PARKING_CRON_SECRET: ${{ secrets.PARKING_CRON_SECRET }}
    steps:
      - name: Skip safely unless configured
        id: enabled
        shell: bash
        run: |
          if [ -z "$PARKING_NOTIFICATION_URL" ] || [ -z "$PARKING_CRON_SECRET" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Notification endpoint not configured; no external action."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Process outbox and Madrid Monday report
        if: steps.enabled.outputs.enabled == 'true'
        shell: bash
        run: |
          curl --fail-with-body --retry 2 --max-time 90 \
            --request POST "$PARKING_NOTIFICATION_URL" \
            --header 'content-type: application/json' \
            --header "x-parking-cron-secret: $PARKING_CRON_SECRET" \
            --data '{"action":"tick"}'

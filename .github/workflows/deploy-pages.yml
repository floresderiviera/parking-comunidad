name: Deploy Parking Comunidad

on:
  push:
    branches:
      - main
      - supabase-poc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: parking-comunidad-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-src

      - name: Checkout preproduction
        uses: actions/checkout@v6
        with:
          ref: supabase-poc
          path: pre-src

      - name: Validate and build preproduction
        working-directory: pre-src
        run: |
          set -e

          npm ci

          for f in tools/preprod-tests/*.mjs; do
            echo "===== $f ====="
            node "$f"
          done

          npm run build:vite

          cmp -s assets/js/app.bundle.js dist/assets/js/app.bundle.js
          echo "Vite bundle matches committed frontend bundle"

          node --check dist/assets/js/app.bundle.js
          node --check assets/js/core.js

      - name: Build Pages artifact
        run: |
          set -e

          mkdir -p _site

          # PRODUCCION: siempre sale de main.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='assets/js/app.bundle.preprod.js' \
            main-src/ _site/

          # PREPRODUCCION: siempre sale de supabase-poc.
          mkdir -p _site/preproduccion

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            pre-src/ _site/preproduccion/

          # Los artefactos frontend de PRE se publican desde Vite.
          cp pre-src/dist/assets/js/app.bundle.js \
            _site/preproduccion/assets/js/app.bundle.js

          cp pre-src/dist/assets/js/supabase/entry.js \
            _site/preproduccion/assets/js/supabase/entry.js

          # PRE usa el index.html de la rama supabase-poc.
          # El rsync anterior lo publica como /preproduccion/index.html.

          # Verificaciones mínimas del artefacto.
          test -f _site/index.html
          test -f _site/preproduccion/index.html
          test -f _site/assets/js/app.bundle.js
          test -f _site/preproduccion/assets/js/app.bundle.js
          test -f _site/preproduccion/assets/js/supabase/entry.js

          echo "=== PRODUCCION ==="
          grep -E 'title>|app\.bundle' _site/index.html

          echo "=== PREPRODUCCION ==="
          grep -E 'title>|app\.bundle' _site/preproduccion/index.html

          echo "=== ARTEFACTO FINAL ==="
          find _site -maxdepth 3 -type f | sort | head -200

          echo "=== PRE INDEX ==="
          ls -la _site/preproduccion/
          test -f _site/preproduccion/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
